<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Power Build | EP2 Lithium Grease</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f5f7fa;
            color: #1e2a3e;
            min-height: 100vh;
        }

        .image-page {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 20px;
        }

        .flyer-image {
            width: 100%;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            cursor: pointer;
            transition: transform 0.1s ease;
            position: relative;
        }

        .flyer-image:active {
            transform: scale(0.99);
        }

        .flyer-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* ─── CINEMA EASTER EGG ─── */
        .cinema-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow-x: hidden;
        }

        @keyframes driveToTheWall {
            0% {
                transform: translateX(0) translateY(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            85% {
                opacity: 1;
            }
            100% {
                transform: translateX(-100vw) translateY(0);
                opacity: 0;
            }
        }

        .cinema-car {
            position: absolute;
            bottom: 3%;
            right: 0;
            animation: driveToTheWall 5s linear forwards;
        }

        .cinema-car img {
            width: 600px;
            max-width: 80vw;
            height: auto;
            display: block;
            background: transparent;
        }

        @keyframes dustPuff {
            0% {
                transform: scale(0);
                opacity: 0.8;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        .dust {
            position: absolute;
            width: 8px;
            height: 8px;
            background: rgba(212, 175, 55, 0.5);
            border-radius: 50%;
            animation: dustPuff 0.6s ease-out forwards;
        }

        .float-wa {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #25D366;
            color: #fff;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.3);
            transition: 0.3s;
            z-index: 999;
        }

        .float-wa:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(37, 211, 102, 0.5);
        }

        .wa-tooltip {
            display: none;
            position: absolute;
            right: 70px;
            background: #0b0d10;
            color: #fff;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            white-space: nowrap;
        }

        .float-wa:hover .wa-tooltip {
            display: block;
        }

        @media (max-width: 700px) {
            .cinema-car img {
                width: 320px;
            }
            .cinema-car {
                bottom: 2%;
            }
        }

        @media (max-width: 500px) {
            .float-wa {
                width: 50px;
                height: 50px;
                font-size: 1.5rem;
                bottom: 16px;
                right: 16px;
            }
        }
    </style>
</head>
<body>

<!-- ═══ NAVBAR LOADER ═══ -->
<div id="navbar-placeholder"></div>
<script>
    fetch('navbar.html')
        .then(response => {
            if (!response.ok) throw new Error('Navbar not found');
            return response.text();
        })
        .then(data => {
            document.getElementById('navbar-placeholder').innerHTML = data;
            const mobileBtn = document.getElementById('mobileMenu');
            const navLinks = document.getElementById('navLinks');
            if (mobileBtn) {
                mobileBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    navLinks.classList.toggle('show');
                });
            }
            const currentPage = window.location.pathname.split('/').pop() || 'g2.html';
            document.querySelectorAll('.nav-links a').forEach(link => {
                if (link.getAttribute('href') === currentPage) {
                    link.classList.add('active');
                }
            });
        })
        .catch(() => {
            document.getElementById('navbar-placeholder').innerHTML = '<p style="color:red;text-align:center;padding:1rem;">Navbar failed to load</p>';
        });
</script>

<!-- ═══ MAIN CONTENT ═══ -->
<main>
    <div class="image-page">
        <div class="flyer-image" id="ep2Pail">
            <img src="ep2.webp" alt="Power Build EP2 Lithium Grease">
        </div>
    </div>
</main>

<!-- ═══ FOOTER LOADER ═══ -->
<script>
    fetch('footer.html')
        .then(response => {
            if (!response.ok) throw new Error('Footer not found');
            return response.text();
        })
        .then(data => {
            document.body.insertAdjacentHTML('beforeend', data);
        })
        .catch(() => {
            document.body.insertAdjacentHTML('beforeend',
                '<footer style="background:#ffffff;padding:2rem;text-align:center;border-top:3px solid #B22222;color:#1a1a2e;"><p>© 2026 Power Build Tech Engineering Sdn Bhd</p></footer>'
            );
        });
</script>

<!-- ═══ FLOATING WHATSAPP ═══ -->
<a href="https://wa.me/+60143929913" class="float-wa" target="_blank" rel="noopener noreferrer" aria-label="Chat with us on WhatsApp">
    <i class="fab fa-whatsapp"></i>
    <span class="wa-tooltip">Chat with us</span>
</a>

<!-- ═══ EASTER EGG SCRIPT ═══ -->
<script>
    (function() {
        const ep2Element = document.getElementById('ep2Pail');
        let activeCinema = null;

        // Hidden audio element
        const sound = document.createElement('audio');
        sound.style.display = 'none';
        sound.preload = 'auto';
        const source = document.createElement('source');
        source.src = 'grease-sound.mp3';
        source.type = 'audio/mpeg';
        sound.appendChild(source);
        document.body.appendChild(sound);

        function createDust(x, y, count) {
            for (let i = 0; i < count; i++) {
                const dust = document.createElement('div');
                dust.className = 'dust';
                dust.style.left = (x + (Math.random() - 0.5) * 40) + 'px';
                dust.style.top = (y + (Math.random() - 0.5) * 20) + 'px';
                document.body.appendChild(dust);
                setTimeout(() => dust.remove(), 600);
            }
        }

        function playSound() {
            if (sound) {
                sound.currentTime = 0;
                sound.play().catch(() => {});
            }
        }

        function showCinematic() {
            if (activeCinema) {
                activeCinema.remove();
            }

            const container = document.createElement('div');
            container.className = 'cinema-container';

            const carDiv = document.createElement('div');
            carDiv.className = 'cinema-car';
            const carImg = document.createElement('img');
            carImg.src = 'car.png';
            carImg.alt = 'Grease Car';
            carImg.style.background = 'transparent';
            carImg.onerror = function() {
                this.style.display = 'none';
                const fallback = document.createElement('div');
                fallback.style.width = '500px';
                fallback.style.height = '180px';
                fallback.style.background = '#C5A028';
                fallback.style.borderRadius = '16px';
                fallback.style.display = 'flex';
                fallback.style.alignItems = 'center';
                fallback.style.justifyContent = 'center';
                fallback.style.color = '#fff';
                fallback.style.fontWeight = 'bold';
                fallback.style.fontSize = '1.5rem';
                fallback.innerHTML = '🚗 GREASE CAR 🚗';
                carDiv.appendChild(fallback);
            };
            carDiv.appendChild(carImg);
            container.appendChild(carDiv);

            document.body.appendChild(container);
            activeCinema = container;

            setTimeout(() => {
                if (activeCinema === container) {
                    container.remove();
                    activeCinema = null;
                }
            }, 5500);
        }

        if (ep2Element) {
            ep2Element.addEventListener('click', function(e) {
                playSound();
                createDust(e.clientX, e.clientY, 6);
                showCinematic();
            });
        }
    })();
</script>

</body>
</html>
