<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Power Build | Mission</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #F5F2EB; color: #1E2A3A; line-height: 1.5; }
        
        .navbar {
            background: #FFFFFFdd;
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid #D4AF37;
            padding: 0.8rem 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        .logo h1 { font-size: 1.4rem; font-weight: 800; color: #C5A028; }
        .logo p { font-size: 0.7rem; color: #5A6E7A; letter-spacing: 1px; }
        .nav-links { display: flex; flex-wrap: wrap; gap: 1.5rem; list-style: none; }
        .nav-links a { text-decoration: none; color: #2C3E40; font-weight: 500; font-size: 0.9rem; transition: 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: #D4AF37; border-bottom: 2px solid #D4AF37; padding-bottom: 4px; }
        .mobile-menu { display: none; font-size: 1.5rem; cursor: pointer; color: #C5A028; }
        @media (max-width: 780px) {
            .navbar { padding: 0.8rem 1rem; }
            .nav-links { display: none; width: 100%; flex-direction: column; text-align: center; padding: 1rem 0; gap: 0.8rem; }
            .nav-links.show { display: flex; }
            .mobile-menu { display: block; }
        }
        
        .image-page { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
        .flyer-image { width: 100%; background: #FFFFFF; border-radius: 1.5rem; overflow: hidden; box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1); border: 1px solid #E8E0D0; }
        .flyer-image img { width: 100%; height: auto; display: block; }
        
        footer { background: #1E2A3A; color: #CFDDE5; padding: 2rem 2rem 1.5rem; margin-top: 2rem; }
        .footer-content { max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2rem; }
        .footer-col { flex: 1; min-width: 200px; }
        .footer-col h4 { color: #D4AF37; margin-bottom: 0.8rem; font-size: 1rem; }
        .footer-col p, .footer-col a { font-size: 0.8rem; color: #B0C0CE; text-decoration: none; line-height: 1.6; }
        .footer-col a:hover { color: #D4AF37; }
        .copyright { text-align: center; padding-top: 2rem; font-size: 0.7rem; border-top: 1px solid #2F3E4E; margin-top: 2rem; }
        
        .float-wa {
            position: fixed; bottom: 28px; right: 28px; z-index: 1000;
            background: #25D366; color: white; width: 60px; height: 60px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 32px; text-decoration: none; animation: pulse-glow 2s infinite;
        }
        .float-wa:hover { transform: scale(1.08); background: #20b859; }
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.6);}
            70% { box-shadow: 0 0 0 12px rgba(37, 211, 102, 0);}
            100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0);}
        }
        .wa-tooltip { position: absolute; right: 70px; background: #1F2A3A; color: #eee; font-size: 0.75rem; padding: 5px 12px; border-radius: 30px; white-space: nowrap; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
        .float-wa:hover .wa-tooltip { opacity: 1; }
        @media (max-width: 600px) { .image-page { padding: 0 1rem; margin: 1rem auto; } .wa-tooltip { display: none; } }
    </style>
</head>
<body>

<div id="header-placeholder"></div>

<div class="image-page">
    <div class="flyer-image">
        <img src="mission.webp" alt="Power Build Mission - Global Mission Statement">
    </div>
</div>

<div id="footer-placeholder"></div>

<a href="https://wa.me/+60143929913" class="float-wa" target="_blank" rel="noopener noreferrer">
    <i class="fab fa-whatsapp"></i>
    <span class="wa-tooltip">Chat with us</span>
</a>

<script>
    fetch('header.html').then(r => r.text()).then(data => document.getElementById('header-placeholder').innerHTML = data);
    fetch('footer.html').then(r => r.text()).then(data => document.getElementById('footer-placeholder').innerHTML = data);
</script>
</body>
</html>
