<!-- header.html - Centralized Navigation Bar -->
<style>
    /* GUARANTEED STICKY NAVBAR - CSS included directly */
    .navbar {
        position: sticky;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10000;
        background: #FFFFFFdd;
        backdrop-filter: blur(12px);
        border-bottom: 2px solid #D4AF37;
        padding: 0.8rem 2rem;
        box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }

    .nav-container {
        max-width: 1280px;
        margin: 0 auto;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
    }

    .logo h1 {
        font-size: 1.4rem;
        font-weight: 800;
        color: #C5A028;
        margin: 0;
    }

    .logo p {
        font-size: 0.7rem;
        color: #5A6E7A;
        letter-spacing: 1px;
        margin: 0;
    }

    .nav-links {
        display: flex;
        flex-wrap: wrap;
        gap: 1.5rem;
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .nav-links a {
        text-decoration: none;
        color: #2C3E40;
        font-weight: 500;
        font-size: 0.9rem;
        transition: 0.2s;
    }

    .nav-links a:hover,
    .nav-links a.active {
        color: #D4AF37;
        border-bottom: 2px solid #D4AF37;
        padding-bottom: 4px;
    }

    .mobile-menu {
        display: none;
        font-size: 1.5rem;
        cursor: pointer;
        color: #C5A028;
    }

    @media (max-width: 780px) {
        .navbar {
            padding: 0.8rem 1rem;
        }
        .nav-links {
            display: none;
            width: 100%;
            flex-direction: column;
            text-align: center;
            padding: 1rem 0;
            gap: 0.8rem;
        }
        .nav-links.show {
            display: flex;
        }
        .mobile-menu {
            display: block;
        }
    }
</style>

<nav class="navbar">
    <div class="nav-container">
        <div class="logo">
            <h1>POWER BUILD</h1>
            <p>Tech Engineering Sdn Bhd</p>
        </div>
        <div class="mobile-menu" id="mobileMenu">
            <i class="fas fa-bars"></i>
        </div>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html" class="nav-home">Home</a></li>
            <li><a href="about.html" class="nav-about">About</a></li>
            <li><a href="mission.html" class="nav-mission">Mission</a></li>
            <li><a href="products.html" class="nav-products">Products</a></li>
            <li><a href="proof.html" class="nav-proof">The Proof</a></li>
            <li><a href="contact.html" class="nav-contact">Contact</a></li>
        </ul>
    </div>
</nav>

<script>
    // Highlight current page in navigation
    const currentPage = window.location.pathname.split('/').pop();
    const navLinks = document.querySelectorAll('.nav-links a');
    navLinks.forEach(link => {
        const linkPage = link.getAttribute('href');
        if (linkPage === currentPage) {
            link.classList.add('active');
        }
    });

    // Mobile menu toggle
    const mobileBtn = document.getElementById('mobileMenu');
    const navLinksContainer = document.getElementById('navLinks');
    if (mobileBtn) {
        mobileBtn.addEventListener('click', () => {
            navLinksContainer.classList.toggle('show');
        });
    }
</script>
