<!-- header.html - Centralized Navigation Bar -->
<nav class="navbar">
    <div class="nav-container">
        <div class="logo">
            <h1>POWER BUILD</h1>
            <p>Tech Engineering Sdn Bhd</p>
        </div>
        <div class="mobile-menu" id="mobileMenu">
            <i class="fas fa-bars"></i>
        </div>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html" class="nav-home">Home</a></li>
            <li><a href="about.html" class="nav-about">About</a></li>
            <li><a href="mission.html" class="nav-mission">Mission</a></li>
            <li><a href="products.html" class="nav-products">Products</a></li>
            <li><a href="proof.html" class="nav-proof">The Proof</a></li>
            <li><a href="contact.html" class="nav-contact">Contact</a></li>
        </ul>
    </div>
</nav>

<script>
    // Highlight current page in navigation
    const currentPage = window.location.pathname.split('/').pop();
    const navLinks = document.querySelectorAll('.nav-links a');
    navLinks.forEach(link => {
        const linkPage = link.getAttribute('href');
        if (linkPage === currentPage) {
            link.classList.add('active');
        }
    });

    // Mobile menu toggle
    const mobileBtn = document.getElementById('mobileMenu');
    const navLinksContainer = document.getElementById('navLinks');
    if (mobileBtn) {
        mobileBtn.addEventListener('click', () => {
            navLinksContainer.classList.toggle('show');
        });
    }
</script>
