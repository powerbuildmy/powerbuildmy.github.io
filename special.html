<!-- VIDEO OVERLAY + FLOWER BLOOM -->
<div id="videoOverlay" style="
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(10px);
    z-index: 9999;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    animation: overlayFadeIn 0.5s ease;
">
    <canvas id="flowerCanvas" style="
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
    "></canvas>

    <div style="
        position: relative;
        z-index: 2;
        max-width: 800px;
        width: 90%;
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        background: #000;
        transform: scale(0.95);
        animation: videoPopIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    ">
        <video id="specialVideo" src="special.mp4" muted autoplay playsinline loop style="
            width: 100%;
            height: auto;
            display: block;
            border-radius: 28px;
        "></video>
        <button onclick="closeOverlay()" style="
            position: absolute;
            top: 12px;
            right: 16px;
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.5rem;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: 0.3s;
            z-index: 10;
        ">✕</button>
    </div>
</div>

<style>
    @keyframes overlayFadeIn {
        0% { opacity: 0; }
        100% { opacity: 1; }
    }
    @keyframes videoPopIn {
        0% { transform: scale(0.8); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }
</style>

<script>
    // ─── FLOWER BLOOM ───
    (function() {
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');
        let petals = [];
        let animationId = null;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        function createPetal(x, y) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 2 + Math.random() * 4;
            const size = 20 + Math.random() * 35;
            const color = `hsl(${Math.floor(Math.random() * 60 + 330)}, 90%, 60%)`;
            return {
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 1.5,
                size,
                rotation: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 0.1,
                life: 1,
                color,
                decay: 0.006 + Math.random() * 0.01,
                gravity: 0.05,
                drag: 0.99
            };
        }

        function drawPetal(p) {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rotation);
            ctx.globalAlpha = p.life * 0.9;
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.ellipse(0, 0, p.size * 0.4, p.size * 0.7, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function updatePetals() {
            for (let i = petals.length - 1; i >= 0; i--) {
                const p = petals[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity;
                p.vx *= p.drag;
                p.vy *= p.drag;
                p.rotation += p.rotSpeed;
                p.life -= p.decay;
                if (p.life <= 0) petals.splice(i, 1);
            }
        }

        function drawLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (const p of petals) drawPetal(p);
            updatePetals();
            if (petals.length > 0) {
                animationId = requestAnimationFrame(drawLoop);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                animationId = null;
            }
        }

        function burstFlowers(x, y) {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            petals = [];
            const count = 60 + Math.floor(Math.random() * 60);
            for (let i = 0; i < count; i++) {
                petals.push(createPetal(x, y));
            }
            drawLoop();
        }

        window.burstFlowers = burstFlowers;
        window.resizeCanvas = resizeCanvas;
    })();

    // ─── OPEN / CLOSE OVERLAY ───
    function openOverlay(e) {
        const overlay = document.getElementById('videoOverlay');
        overlay.style.display = 'flex';

        let x, y;
        if (e) {
            x = e.clientX;
            y = e.clientY;
        } else {
            x = window.innerWidth / 2;
            y = window.innerHeight / 2;
        }

        setTimeout(() => {
            window.burstFlowers(x, y);
        }, 100);

        const video = document.getElementById('specialVideo');
        video.currentTime = 0;
        video.play().then(() => {
            video.muted = false;   // ✅ UNMUTE → AUDIO PLAYS
        }).catch(() => {});
    }

    function closeOverlay() {
        const overlay = document.getElementById('videoOverlay');
        overlay.style.display = 'none';
        const video = document.getElementById('specialVideo');
        video.pause();
        if (window.animationId) {
            cancelAnimationFrame(window.animationId);
            window.animationId = null;
        }
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // ─── CLICK ON HERO ───
    document.addEventListener('DOMContentLoaded', function() {
        const heroWrapper = document.getElementById('heroClickArea');
        if (heroWrapper) {
            heroWrapper.addEventListener('click', function(e) {
                openOverlay(e);
            });
        }

        const overlay = document.getElementById('videoOverlay');
        overlay.addEventListener('click', function(e) {
            if (e.target === this || e.target === document.getElementById('flowerCanvas')) {
                closeOverlay();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeOverlay();
        });
    });

    window.openOverlay = openOverlay;
    window.closeOverlay = closeOverlay;

    // ─── SLIDESHOW ───
    (function() {
        var container = document.getElementById('slideshow-container');
        if (!container) return;

        var images = [
            'ss1.webp',
            'ss2.webp',
            '350ml.webp',
            '350mlm.webp',
            '350mlc.webp',
            'ss3.webp',
            'ss4.webp',
            'pbs.webp',
            'ss5.webp'
        ];

        var currentIndex = 0;
        var autoPlayTimer = null;
        var isPaused = false;

        var prevBtn = document.getElementById('prevSlide');
        var nextBtn = document.getElementById('nextSlide');
        var dotsContainer = document.getElementById('dots-container');

        var img = document.createElement('img');
        img.src = images[0];
        img.alt = 'Power Build Engine Treatment 350ml – slideshow';
        img.style.cssText = 'width:100%; height:auto; display:block;';
        container.appendChild(img);

        function renderDots() {
            dotsContainer.innerHTML = '';
            images.forEach(function(_, i) {
                var dot = document.createElement('span');
                var isActive = i === currentIndex;
                dot.style.cssText = [
                    'width: 14px;',
                    'height: 14px;',
                    'border-radius: 50%;',
                    'background: ' + (isActive ? '#B22222' : '#d1d5db') + ';',
                    'cursor: pointer;',
                    'transition: 0.3s;',
                    'border: ' + (isActive ? '2px solid #B22222' : '2px solid transparent') + ';',
                    'box-shadow: ' + (isActive ? '0 0 8px rgba(178,34,34,0.4)' : 'none') + ';'
                ].join('');
                dot.addEventListener('click', function() {
                    pauseAutoPlay();
                    goToSlide(i);
                    setTimeout(resumeAutoPlay, 5000);
                });
                dotsContainer.appendChild(dot);
            });
        }

        function goToSlide(index) {
            if (index < 0) index = images.length - 1;
            if (index >= images.length) index = 0;
            currentIndex = index;
            img.src = images[currentIndex];
            renderDots();
        }

        function nextSlide() { goToSlide(currentIndex + 1); }
        function prevSlide() { goToSlide(currentIndex - 1); }

        function resetAutoPlay() {
            if (autoPlayTimer) clearInterval(autoPlayTimer);
            if (!isPaused) {
                autoPlayTimer = setInterval(function() {
                    goToSlide(currentIndex + 1);
                }, 5000);
            }
        }

        function pauseAutoPlay() {
            isPaused = true;
            if (autoPlayTimer) clearInterval(autoPlayTimer);
        }

        function resumeAutoPlay() {
            isPaused = false;
            resetAutoPlay();
        }

        if (prevBtn) {
            prevBtn.addEventListener('click', function() {
                pauseAutoPlay();
                prevSlide();
                setTimeout(resumeAutoPlay, 5000);
            });
        }

        if (nextBtn) {
            nextBtn.addEventListener('click', function() {
                pauseAutoPlay();
                nextSlide();
                setTimeout(resumeAutoPlay, 5000);
            });
        }

        container.addEventListener('mouseenter', pauseAutoPlay);
        container.addEventListener('mouseleave', resumeAutoPlay);

        var touchStartX = 0;
        var touchEndX = 0;
        container.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        container.addEventListener('touchend', function(e) {
            touchEndX = e.changedTouches[0].screenX;
            var diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 50) {
                pauseAutoPlay();
                if (diff > 0) nextSlide();
                else prevSlide();
                setTimeout(resumeAutoPlay, 5000);
            }
        }, { passive: true });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') {
                pauseAutoPlay();
                prevSlide();
                setTimeout(resumeAutoPlay, 5000);
            }
            if (e.key === 'ArrowRight') {
                pauseAutoPlay();
                nextSlide();
                setTimeout(resumeAutoPlay, 5000);
            }
        });

        renderDots();
        resetAutoPlay();
    })();
</script>
