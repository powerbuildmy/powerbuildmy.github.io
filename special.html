<!-- ═══ SLIDESHOW SCRIPT ═══ -->
<script>
    (function() {
        var container = document.getElementById('slideshow-container');
        if (!container) return;

        var images = [
            'ss1.webp',
            'ss2.webp',
            '350ml.webp',
            '350mlm.webp',
            '350mlc.webp',
            'ss3.webp',
            'ss4.webp',
            'pbs.webp',
            'ss5.webp'
        ];

        var currentIndex = 0;
        var autoPlayTimer = null;
        var isPaused = false;

        var prevBtn = document.getElementById('prevSlide');
        var nextBtn = document.getElementById('nextSlide');
        var dotsContainer = document.getElementById('dots-container');

        var img = document.createElement('img');
        img.src = images[0];
        img.alt = 'Power Build Engine Treatment 350ml – slideshow';
        img.style.cssText = 'width:100%; height:auto; display:block;';
        container.appendChild(img);

        function renderDots() {
            dotsContainer.innerHTML = '';
            images.forEach(function(_, i) {
                var dot = document.createElement('span');
                var isActive = i === currentIndex;
                dot.style.cssText = [
                    'width: 14px;',
                    'height: 14px;',
                    'border-radius: 50%;',
                    'background: ' + (isActive ? '#B22222' : '#d1d5db') + ';',
                    'cursor: pointer;',
                    'transition: 0.3s;',
                    'border: ' + (isActive ? '2px solid #B22222' : '2px solid transparent') + ';',
                    'box-shadow: ' + (isActive ? '0 0 8px rgba(178,34,34,0.4)' : 'none') + ';'
                ].join('');
                dot.addEventListener('click', function() {
                    pauseAutoPlay();
                    goToSlide(i);
                    setTimeout(resumeAutoPlay, 5000);
                });
                dotsContainer.appendChild(dot);
            });
        }

        function goToSlide(index) {
            if (index < 0) index = images.length - 1;
            if (index >= images.length) index = 0;
            currentIndex = index;
            img.src = images[currentIndex];
            renderDots();
        }

        function nextSlide() { goToSlide(currentIndex + 1); }
        function prevSlide() { goToSlide(currentIndex - 1); }

        function resetAutoPlay() {
            if (autoPlayTimer) clearInterval(autoPlayTimer);
            if (!isPaused) {
                autoPlayTimer = setInterval(function() {
                    goToSlide(currentIndex + 1);
                }, 5000);
            }
        }

        function pauseAutoPlay() {
            isPaused = true;
            if (autoPlayTimer) clearInterval(autoPlayTimer);
        }

        function resumeAutoPlay() {
            isPaused = false;
            resetAutoPlay();
        }

        if (prevBtn) {
            prevBtn.addEventListener('click', function() {
                pauseAutoPlay();
                prevSlide();
                setTimeout(resumeAutoPlay, 5000);
            });
        }

        if (nextBtn) {
            nextBtn.addEventListener('click', function() {
                pauseAutoPlay();
                nextSlide();
                setTimeout(resumeAutoPlay, 5000);
            });
        }

        container.addEventListener('mouseenter', pauseAutoPlay);
        container.addEventListener('mouseleave', resumeAutoPlay);

        var touchStartX = 0;
        var touchEndX = 0;
        container.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        container.addEventListener('touchend', function(e) {
            touchEndX = e.changedTouches[0].screenX;
            var diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 50) {
                pauseAutoPlay();
                if (diff > 0) nextSlide();
                else prevSlide();
                setTimeout(resumeAutoPlay, 5000);
            }
        }, { passive: true });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') {
                pauseAutoPlay();
                prevSlide();
                setTimeout(resumeAutoPlay, 5000);
            }
            if (e.key === 'ArrowRight') {
                pauseAutoPlay();
                nextSlide();
                setTimeout(resumeAutoPlay, 5000);
            }
        });

        renderDots();
        resetAutoPlay();
    })();
</script>
