<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Power Build | Special - 350ml Engine Treatment</title>
    <!-- All meta, CSS, and head content remains exactly as before -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <!-- Navbar (unchanged) -->
    <nav class="navbar">...</nav>

    <main style="background: #f5f7fa; padding: 2rem 0;">
        <div style="max-width: 1000px; margin: 0 auto; padding: 0 20px;">

            <!-- ===== SLIDESHOW WRAPPER (no overlay controls) ===== -->
            <div style="background: #f5f7fa; border-radius: 28px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.05); margin-bottom: 1rem;">
                <div id="slideshow-container" style="width:100%; display: grid; grid-template-columns: 1fr; grid-template-rows: auto; position: relative;"></div>
            </div>

            <!-- ===== CONTROLS (now BELOW the image) ===== -->
            <div style="display: flex; align-items: center; justify-content: center; gap: 20px; margin: 0 auto 2rem auto; max-width: 600px; flex-wrap: wrap;">

                <!-- LEFT ARROW -->
                <button id="prevSlide" style="background: #1a3a8f; color: white; border: none; border-radius: 50%; width: 44px; height: 44px; font-size: 24px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">‹</button>

                <!-- DOTS -->
                <div id="dots-container" style="display: flex; gap: 12px; align-items: center; background: transparent; padding: 0;"></div>

                <!-- RIGHT ARROW -->
                <button id="nextSlide" style="background: #1a3a8f; color: white; border: none; border-radius: 50%; width: 44px; height: 44px; font-size: 24px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">›</button>
            </div>

            <!-- Rest of your content block (unchanged) -->
            <div style="background: white; border-radius: 28px; padding: 2rem; box-shadow: 0 4px 16px rgba(0,0,0,0.05);">
                <!-- All existing text content remains exactly the same -->
            </div>
        </div>
    </main>

    <!-- Footer (unchanged) -->
    <footer>...</footer>

    <!-- Floating WhatsApp (unchanged) -->
    <a href="https://wa.me/+60143929913" class="float-wa" target="_blank" rel="noopener noreferrer">...</a>

    <script>
        // Mobile menu + active link (unchanged)

        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('slideshow-container');
            if (!container) return;

            const images = [
                '350ml.webp',
                'pbs.webp',
                '350mlc.webp',
                'pbs.webp',
                '350mlm.webp',
                'pbs.webp',
                'ss1.webp',
                'ss2.webp',
                'ss3.webp',
                'ss4.webp'
            ];
            let currentIndex = 0;
            let autoPlayTimer = null;
            let isPaused = false;

            const prevBtn = document.getElementById('prevSlide');
            const nextBtn = document.getElementById('nextSlide');
            const dotsContainer = document.getElementById('dots-container');

            const img = document.createElement('img');
            img.src = images[0];
            img.alt = 'Power Build Engine Treatment 350ml – slideshow';
            img.style.cssText = 'width:100%; height:auto; display:block;';
            container.appendChild(img);

            function renderDots() {
                dotsContainer.innerHTML = '';
                images.forEach((_, i) => {
                    const dot = document.createElement('span');
                    dot.style.cssText = `
                        width: 14px;
                        height: 14px;
                        border-radius: 50%;
                        background: ${i === currentIndex ? '#C5A028' : '#d1d5db'};
                        cursor: pointer;
                        transition: 0.3s;
                        border: ${i === currentIndex ? '2px solid #C5A028' : '2px solid transparent'};
                        box-shadow: ${i === currentIndex ? '0 0 8px rgba(197,160,40,0.5)' : 'none'};
                    `;
                    dot.addEventListener('click', () => goToSlide(i));
                    dotsContainer.appendChild(dot);
                });
            }

            function goToSlide(index) {
                if (index < 0) index = images.length - 1;
                if (index >= images.length) index = 0;
                currentIndex = index;
                img.src = images[currentIndex];
                renderDots();
                resetAutoPlay();
            }

            function nextSlide() { goToSlide(currentIndex + 1); }
            function prevSlide() { goToSlide(currentIndex - 1); }

            function resetAutoPlay() {
                if (autoPlayTimer) clearInterval(autoPlayTimer);
                if (!isPaused) {
                    autoPlayTimer = setInterval(() => {
                        goToSlide(currentIndex + 1);
                    }, 5000);
                }
            }

            function pauseAutoPlay() {
                isPaused = true;
                if (autoPlayTimer) clearInterval(autoPlayTimer);
            }

            function resumeAutoPlay() {
                isPaused = false;
                resetAutoPlay();
            }

            prevBtn.addEventListener('click', () => { pauseAutoPlay(); prevSlide(); setTimeout(resumeAutoPlay, 5000); });
            nextBtn.addEventListener('click', () => { pauseAutoPlay(); nextSlide(); setTimeout(resumeAutoPlay, 5000); });

            // Hover pause on the image container only
            container.addEventListener('mouseenter', pauseAutoPlay);
            container.addEventListener('mouseleave', resumeAutoPlay);

            // Touch / swipe support
            let touchStartX = 0;
            let touchEndX = 0;
            container.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
            container.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                const diff = touchStartX - touchEndX;
                if (Math.abs(diff) > 50) {
                    pauseAutoPlay();
                    if (diff > 0) nextSlide();
                    else prevSlide();
                    setTimeout(resumeAutoPlay, 5000);
                }
            }, { passive: true });

            // Keyboard support
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') { pauseAutoPlay(); prevSlide(); setTimeout(resumeAutoPlay, 5000); }
                if (e.key === 'ArrowRight') { pauseAutoPlay(); nextSlide(); setTimeout(resumeAutoPlay, 5000); }
            });

            renderDots();
            resetAutoPlay();
        });
    </script>
</body>
</html>
